{% extends "base.html" %}

{% block content %}

<h1>Manual handling</h1>

<div class="remote">

    <button
        class="up"
        onclick="send('forward')">
        Forward
    </button>


    <div class="middle">

        <button onclick="send('left')">
            Left
        </button>


        <button
            class="stop"
            onclick="send('stop')">
            Stop
        </button>


        <button onclick="send('right')">
            Right
        </button>

    </div>


    <button
        class="down"
        onclick="send('backward')">
        Backward
    </button>

</div>


<hr>


<h2>Navigation control</h2>


<div class="nav-control">

    <button onclick="startNav()">
        Start navigation
    </button>


    <button onclick="stopNav()">
        Stop navigation
    </button>

</div>



<div class="nav-status-panel">


    <h3>Navigation status</h3>


    <p>
        <strong>Status:</strong>
        <span id="nav-status">Idle</span>
    </p>


    <p>
        <strong>Command:</strong>
        <span id="nav-command">-</span>
    </p>



    <hr>


    <h3>GPS</h3>


    <p>
        <strong>Current position:</strong>
        <span id="gps-position">-</span>
    </p>


    <p>
        <strong>Target point:</strong>
        <span id="nav-target">-</span>
    </p>


    <p>
        <strong>Distance:</strong>
        <span id="nav-distance">-</span>
    </p>



    <hr>


    <h3>Heading</h3>


    <p>
        <strong>Current heading:</strong>
        <span id="heading-current">-</span>°
    </p>


    <p>
        <strong>Target heading:</strong>
        <span id="heading-target">-</span>°
    </p>


    <p>
        <strong>Turn required:</strong>
        <span id="heading-difference">-</span>°
    </p>


</div>



<style>


.remote {

    width:300px;

    margin:auto;

    display:flex;

    flex-direction:column;

    align-items:center;

}



.remote button {

    width:90px;

    height:70px;

    margin:8px;

    font-size:16px;

}



.middle {

    display:flex;

    justify-content:center;

    align-items:center;

}



.stop {

    background:#aa0000;

    color:white;

}



.nav-control {

    margin-top:20px;

    display:flex;

    gap:10px;

}



.nav-control button {

    padding:10px 20px;

    font-size:16px;

}



.nav-status-panel {

    margin:30px auto;

    max-width:450px;

    text-align:left;

    background:#111;

    padding:20px;

    border-radius:10px;

}



hr {

    margin:20px 0;

}


</style>




<script>


function send(cmd)
{

    fetch("/command",
    {
        method:"POST",

        headers:
        {
            "Content-Type":"application/json"
        },

        body:JSON.stringify(
        {
            command:cmd
        })
    });

}



function startNav()
{

    fetch("/nav/start",
    {
        method:"POST"
    });

}



function stopNav()
{

    fetch("/nav/stop",
    {
        method:"POST"
    });

}





function updateNavStatus()
{


    fetch("/nav/status")

    .then(resp=>resp.json())

    .then(data=>{


        document
        .getElementById("nav-status")
        .textContent =
            data.state ?? "-";



        document
        .getElementById("nav-command")
        .textContent =
            data.command ?? "-";



        if(data.current_position)
        {

            let p=data.current_position;


            document
            .getElementById("gps-position")
            .textContent =
            `${p.latitude.toFixed(7)}, ${p.longitude.toFixed(7)}`;

        }



        if(data.target)
        {

            let t=data.target;


            document
            .getElementById("nav-target")
            .textContent =
            `${t.latitude.toFixed(7)}, ${t.longitude.toFixed(7)}`;

        }



        if(data.distance != null)
        {

            document
            .getElementById("nav-distance")
            .textContent =
            data.distance.toFixed(2)+" m";

        }



        if(data.heading)
        {

            document
            .getElementById("heading-current")
            .textContent =
            data.heading.current;



            document
            .getElementById("heading-target")
            .textContent =
            data.heading.target;



            document
            .getElementById("heading-difference")
            .textContent =
            data.heading.difference;

        }


    })

    .catch(err=>
    {
        console.log("Navigation status error:",err);
    });


}



setInterval(updateNavStatus,1000);


</script>


{% endblock %}
