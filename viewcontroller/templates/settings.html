{% extends "base.html" %}

{% block content %}

<div class="settings-page">

    <h1>Settings</h1>

    <div class="settings-table-container">

        <table class="settings-table">

            <thead>
                <tr>
                    <th>Setting</th>
                    <th>Value</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>
                        <div class="setting-name">
                            Xbox Controller
                        </div>
                        <div class="setting-description">
                            Enable Xbox controller input
                        </div>
                    </td>

                    <td class="setting-value">

                        <label class="switch">

                            <input
                                type="checkbox"
                                id="xbox-controller-enabled"
                            >

                            <span class="slider"></span>

                        </label>

                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script
    src="{{ url_for('static', filename='js/settings.js') }}"
></script>

{% endblock %}
