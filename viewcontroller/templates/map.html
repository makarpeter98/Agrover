html
{% extends "base.html" %}


{% block content %}


<!-- =========================================================
     LEAFLET CSS
     ========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<!-- =========================================================
     PAGE HEADER
     ========================================================= -->

<div class="page-header">

    <h1>
        Map
    </h1>

    <p>
        Rover position and navigation points
    </p>

</div>



<!-- =========================================================
     MAP LAYOUT
     ========================================================= -->

<div class="map-layout">


    <!-- =====================================================
         MAP
         ===================================================== -->

    <section class="card map-card">

        <div class="card-header">

            <h2>
                Rover Map
            </h2>

            <p>
                Live rover position and waypoints
            </p>

        </div>


        <div class="map-container">

            <div id="map"></div>

        </div>

    </section>



    <!-- =====================================================
         MAP PANEL
         ===================================================== -->

    <section class="card map-panel">

        <div class="card-header">

            <h2>
                Map
            </h2>

            <p>
                Map controls and waypoints
            </p>

        </div>


        <div class="card-body">


            <!-- =================================================
                 WAYPOINT SUMMARY
                 ================================================= -->

            <div class="section-title">
                Waypoints
            </div>


            <div class="data-grid">


                <div class="data-item">

                    <div class="data-label">
                        Points
                    </div>

                    <div
                        class="data-value"
                        id="waypoint-count"
                    >
                        0
                    </div>

                </div>


                <div class="data-item">

                    <div class="data-label">
                        Active Target
                    </div>

                    <div
                        class="data-value"
                        id="active-target"
                    >
                        -
                    </div>

                </div>


            </div>



            <!-- =================================================
                 MAP CONTROLS
                 ================================================= -->

            <div class="section-title">
                Map Controls
            </div>


            <div class="map-controls">

                <button
                    class="button"
                    type="button"
                    onclick="centerOnRover()"
                >
                    Center on Rover
                </button>


                <button
                    class="button"
                    type="button"
                    onclick="centerOnTarget()"
                >
                    Center on Target
                </button>


                <button
                    class="button"
                    type="button"
                    onclick="fitRoute()"
                >
                    Fit Route
                </button>

            </div>



            <!-- =================================================
                 WAYPOINT LIST
                 ================================================= -->

            <div class="section-title">
                Waypoints
            </div>


            <div
                class="waypoint-list"
                id="waypoint-list"
            >

                <div class="waypoint-empty">
                    No waypoints
                </div>

            </div>


        </div>

    </section>


</div>



{% endblock %}



{% block scripts %}

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script
    src="{{ url_for('static', filename='js/map.js') }}"
></script>

{% endblock %}
